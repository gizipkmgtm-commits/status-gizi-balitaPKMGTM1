<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Status Gizi Balita - Online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f0f4f8;
    margin: 0; padding: 0;
  }
  header {
    background: #4e73df;
    color: white;
    padding: 20px 40px;
    text-align: center;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  h1 { margin: 0; font-size: 26px; }
  form {
    background: white;
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    background: #4e73df;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
    font-weight: 600;
    transition: background 0.3s;
  }
  button:hover { background: #2e59d9; }
  table {
    width: 90%;
    margin: 20px auto 50px;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0,0,0,0.05);
  }
  th, td {
    padding: 12px;
    text-align: center;
  }
  th {
    background: #4e73df;
    color: white;
    font-weight: 600;
  }
  tr:nth-child(even) { background: #f9f9f9; }
  tr:hover { background: #e0e7ff; }
  @media (max-width: 600px){
    table, thead, tbody, th, td, tr { display: block; }
    tr { margin-bottom: 15px; }
    td { text-align: right; padding-left: 50%; position: relative; }
    td::before { content: attr(data-label); position: absolute; left: 10px; font-weight: 600; }
  }
</style>
</head>
<body>
<header>
  <h1>Status Gizi Balita (Online)</h1>
</header>

<form id="formGizi">
  <label>Nama Balita:</label><input type="text" id="nama" required>
  <label>Nama Orang Tua:</label><input type="text" id="ortu" required>
  <label>Tanggal Lahir:</label><input type="date" id="tglLahir" required>
  <label>Jenis Kelamin:</label>
  <select id="jenisKelamin"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
  <label>Berat Badan (kg):</label><input type="number" step="0.01" id="bb" required>
  <label>Tinggi Badan (cm):</label><input type="number" step="0.1" id="tb" required>
  <button type="button" onclick="hitungGizi()">Simpan & Hitung</button>
</form>

<table id="tabelData">
  <thead>
    <tr>
      <th>Nama</th><th>Orang Tua</th><th>Umur (bln)</th><th>JK</th>
      <th>BB</th><th>TB</th><th>BB/U</th><th>TB/U</th><th>BB/TB</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// DATA TABEL WHO SEDERHANA
const WHO_BB_U = { "L": [3.3,4.5,5.6,6.4,7,7.5,8,8.4,8.8,9.2,9.6,9.9,10.3,10.6,10.9,11.2,11.5,11.8,12.1,12.4,12.7,13,13.3,13.6,13.9], 
"P": [3.2,4.2,5.1,5.8,6.4,6.9,7.3,7.7,8.1,8.4,8.8,9.1,9.4,9.7,10,10.3,10.6,10.9,11.2,11.5,11.8,12.1,12.4,12.7]};
const WHO_TB_U = { "L": [49.9,54.7,58.4,61.4,63.9,65.9,67.6,69.2,70.6,72,73.3,74.5,75.7,76.9,78,79.2,80.3,81.4,82.5,83.5,84.5,85.5,86.5,87.5], 
"P": [49.1,53.7,57.1,59.8,62.1,64,65.7,67.3,68.8,70.2,71.6,72.9,74.1,75.3,76.5,77.7,78.9,79.9,81.1,82.2,83.3,84.5,85.6,86.7]};

let dataBalita = [];

function hitungUmur(tglLahir){
  const lahir = new Date(tglLahir);
  const sekarang = new Date();
  return (sekarang.getFullYear() - lahir.getFullYear())*12 + (sekarang.getMonth() - lahir.getMonth());
}

function statusBBU(bb, umur, jk){
  const umurIndex = Math.min(umur, WHO_BB_U[jk].length-1);
  const median = WHO_BB_U[jk][umurIndex];
  if(bb < 0.9*median) return "Gizi Kurang";
  else if(bb > 1.1*median) return "Gizi Lebih";
  return "Gizi Baik";
}

function statusTBU(tb, umur, jk){
  const umurIndex = Math.min(umur, WHO_TB_U[jk].length-1);
  const median = WHO_TB_U[jk][umurIndex];
  if(tb < 0.9*median) return "Pendek";
  else if(tb > 1.1*median) return "Tinggi";
  return "Normal";
}

function statusBBTB(bb, tb){
  const bmi = bb / ((tb/100)**2);
  if(bmi < 14) return "Kurang";
  else if(bmi > 18) return "Lebih";
  return "Normal";
}

async function hitungGizi(){
  const nama = document.getElementById("nama").value;
  const ortu = document.getElementById("ortu").value;
  const tglLahir = document.getElementById("tglLahir").value;
  const jk = document.getElementById("jenisKelamin").value;
  const bb = parseFloat(document.getElementById("bb").value);
  const tb = parseFloat(document.getElementById("tb").value);
  const umur = hitungUmur(tglLahir);

  const statusBB_U = statusBBU(bb, umur, jk);
  const statusTB_U = statusTBU(tb, umur, jk);
  const statusBB_TB = statusBBTB(bb, tb);

  const row = {nama, ortu, tglLahir, umur, jk, bb, tb, statusBB_U, statusTB_U, statusBB_TB};
  dataBalita.push(row);
  tampilkanTabel();

  // Kirim ke Google Spreadsheet
  const url = "URL_WEB_APP_GOOGLE_SCRIPT"; // ganti dengan URL Web App Anda
  await fetch(url, {
    method:"POST",
    body: JSON.stringify(row),
    headers: {"Content-Type":"application/json"}
  });
}

function tampilkanTabel(){
  const tbody = document.querySelector("#tabelData tbody");
  tbody.innerHTML = "";
  dataBalita.forEach(d=>{
    tbody.innerHTML += `<tr>
      <td data-label="Nama">${d.nama}</td>
      <td data-label="Orang Tua">${d.ortu}</td>
      <td data-label="Umur">${d.umur}</td>
      <td data-label="JK">${d.jk}</td>
      <td data-label="BB">${d.bb}</td>
      <td data-label="TB">${d.tb}</td>
      <td data-label="BB/U">${d.statusBB_U}</td>
      <td data-label="TB/U">${d.statusTB_U}</td>
      <td data-label="BB/TB">${d.statusBB_TB}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
